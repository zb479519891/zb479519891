<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>贪吃蛇 · Snake</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0d1117; color:#e6edf3; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .wrap { width:min(94vw,560px); text-align:center; }
  h1 { margin:0 0 8px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin:12px 0; gap:12px; }
  #score { font-size:20px; font-weight:700; }
  button { border:1px solid #30363d; background:#161b22; color:#e6edf3; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { background:#21262d; }
  canvas { width:100%; max-width:520px; aspect-ratio:1; background:#010409; border:1px solid #30363d; border-radius:12px; image-rendering:pixelated; touch-action:none; }
  .hint { color:#8b949e; margin:10px 0 0; font-size:14px; }
  .pad { display:grid; grid-template-columns:repeat(3,56px); gap:6px; justify-content:center; margin-top:14px; }
  .pad button { width:56px; height:44px; padding:0; font-size:20px; }
  .empty { visibility:hidden; }
</style>
</head>
<body>
<main class="wrap">
  <h1>🐍 贪吃蛇</h1>
  <div class="bar"><span id="score">得分：0</span><button id="restart">重新开始</button></div>
  <canvas id="game" width="520" height="520" aria-label="贪吃蛇游戏"></canvas>
  <div class="hint">方向键 / WASD 控制 · 吃到食物得分 · 撞墙或自己结束</div>
  <div class="pad">
    <button class="empty"></button><button data-dir="up">↑</button><button class="empty"></button>
    <button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button>
  </div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score');
const size=20, cell=canvas.width/size;
let snake,food,dir,nextDir,score,over,timer;

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0}; score=0; over=false;
  placeFood(); scoreEl.textContent='得分：0';
  clearInterval(timer); timer=setInterval(tick,110); draw();
}
function placeFood(){
  do { food={x:Math.floor(Math.random()*size),y:Math.floor(Math.random()*size)}; }
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function setDir(d){
  if(d.x===-dir.x&&d.y===-dir.y) return;
  nextDir=d;
}
function tick(){
  if(over) return;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  const hitWall=head.x<0||head.x>=size||head.y<0||head.y>=size;
  const hitSelf=snake.some((s,i)=>i>0&&s.x===head.x&&s.y===head.y);
  if(hitWall||hitSelf){ over=true; draw(); return; }
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){ score++; scoreEl.textContent='得分：'+score; placeFood(); }
  else snake.pop();
  draw();
}
function draw(){
  ctx.fillStyle='#010409'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='#161b22'; ctx.lineWidth=1;
  for(let i=1;i<size;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(canvas.width,i*cell);ctx.stroke();}
  ctx.fillStyle='#f85149'; ctx.beginPath(); ctx.arc((food.x+.5)*cell,(food.y+.5)*cell,cell*.32,0,Math.PI*2); ctx.fill();
  snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#58a6ff':'#238636';ctx.fillRect(s.x*cell+2,s.y*cell+2,cell-4,cell-4);});
  if(over){ctx.fillStyle='rgba(1,4,9,.72)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText('游戏结束',canvas.width/2,canvas.height/2-10);ctx.font='18px system-ui';ctx.fillText('点击“重新开始”再来一局',canvas.width/2,canvas.height/2+28);}
}
const keys={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};
document.addEventListener('keydown',e=>{const d=keys[e.key];if(d){e.preventDefault();setDir(d);}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[b.dataset.dir])));
document.getElementById('restart').addEventListener('click',reset);
reset();
</script>
</body>
</html>
